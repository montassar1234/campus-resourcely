spring.application.name=campus-resource-hub-backend
server.port=8080

spring.datasource.url=jdbc:mariadb://localhost:3306/campus_resourcely?createDatabaseIfNotExist=true
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

app.name=TEK-UP Resource Hub
app.message=Welcome to the TEK-UP Resource Hub API
app.frontend-url=http://localhost:3000,http://127.0.0.1:3000,http://localhost:4200,http://127.0.0.1:4200
app.borrow-days=7
app.jwt-secret=campus-resourcely-academic-validation-secret-key-2026
app.jwt-expiration-hours=12
