spring.application.name=campus-resource-hub-backend
server.port=8080

spring.datasource.url=jdbc:h2:mem:campusresourcehub
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

spring.profiles.active=dev

app.name=Campus Resource Hub
app.message=Welcome to the Campus Resource Hub API
app.frontend-url=http://localhost:3000,http://localhost:4200
app.borrow-days=14
